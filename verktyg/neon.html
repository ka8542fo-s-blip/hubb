<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Neon</title>
<style>
@font-face{font-family:"Comfortaa";src:url("../fonts/comfortaa-latin-400-normal.woff2") format("woff2");}
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden}
canvas{position:absolute;inset:0}
#glow{position:absolute;inset:0;pointer-events:none}
#sign{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:var(--gap,40px)}
.word{font-family:"Comfortaa",sans-serif;letter-spacing:.01em;color:#fff3f0;white-space:nowrap;line-height:1;
  -webkit-text-stroke:var(--stroke,0.6px) #ffd9d2;
  text-shadow:
    0 0 2px #fff,
    0 0 6px #ffb3a8,
    0 0 12px #ff5547,
    0 0 22px #ff3326,
    0 0 40px #f01d12,
    0 0 70px #c4100a,
    0 0 110px #8f0a06;}
.icon{filter:
    drop-shadow(0 0 2px #fff)
    drop-shadow(0 0 6px #ff6a5c)
    drop-shadow(0 0 14px #ff3326)
    drop-shadow(0 0 30px #e0170d)
    drop-shadow(0 0 60px #a00c07);}
.icon path,.icon circle,.icon rect,.icon line,.icon polyline{fill:none;stroke:#fff1ee;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="stage">
  <canvas id="wall"></canvas>
  <canvas id="glow"></canvas>
  <div id="sign"></div>
</div>
<script>
// Inställningar i adressen: w, h, brick, text, size, icon, iconsize, sw, seed, glow, gx, gy, ty, rot
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1500, H = +q.get('h') || 600;
const BRICK = +q.get('brick') || 112;
const TEXT = q.get('text') || '';
const SIZE = +q.get('size') || 150;
const ICON = q.get('icon') || '';
const ICONSIZE = +q.get('iconsize') || 150;
const SEED = +q.get('seed') || 7;
const GLOW = +q.get('glow') || 1;

let s = SEED;
function rnd() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const wall = document.getElementById('wall');
wall.width = W; wall.height = H;
const g = wall.getContext('2d');

// fogen mellan teglen
g.fillStyle = '#060606';
g.fillRect(0, 0, W, H);

const bw = BRICK, bh = Math.round(BRICK * 0.33), m = Math.max(3, Math.round(BRICK * 0.035));
for (let row = 0, y = -bh * 0.4; y < H + bh; row++, y += bh) {
  const off = (row % 2) ? -bw / 2 : 0;
  for (let x = off - bw; x < W + bw; x += bw) {
    const l = 5.2 + rnd() * 4.2;            // ljushet i procent
    const hue = 4 + rnd() * 12;
    const sat = 8 + rnd() * 10;
    g.fillStyle = `hsl(${hue} ${sat}% ${l}%)`;
    const bx = x + m / 2, by = y + m / 2, ww = bw - m, hh = bh - m;
    g.beginPath();
    g.roundRect(bx, by, ww, hh, 2);
    g.fill();
    // prickar i teglet
    const n = Math.round(ww * hh / 18);
    for (let i = 0; i < n; i++) {
      const a = rnd() * 0.10;
      g.fillStyle = rnd() < 0.5 ? `rgba(255,235,225,${a})` : `rgba(0,0,0,${a * 2.2})`;
      g.fillRect(bx + rnd() * ww, by + rnd() * hh, 1 + rnd() * 1.6, 1 + rnd() * 1.6);
    }
    // kanter
    g.fillStyle = 'rgba(255,255,255,0.035)';
    g.fillRect(bx + 1, by, ww - 2, 1.5);
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillRect(bx + 1, by + hh - 2, ww - 2, 2);
  }
}
// mörkare kanter runt bilden
let vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.75);
vg.addColorStop(0, 'rgba(0,0,0,0)');
vg.addColorStop(0.55, 'rgba(0,0,0,0.45)');
vg.addColorStop(1, 'rgba(0,0,0,0.9)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);

// rött sken från skylten på väggen
const glow = document.getElementById('glow');
glow.width = W; glow.height = H;
const gg = glow.getContext('2d');
gg.globalCompositeOperation = 'source-over';
const gx = (+q.get('gx') || 0.5) * W, gy = (+q.get('gy') || 0.5) * H;
const r = Math.max(W, H) * 0.5;
let rg = gg.createRadialGradient(gx, gy, 0, gx, gy, r);
rg.addColorStop(0, `rgba(255,42,30,${0.5 * GLOW})`);
rg.addColorStop(0.22, `rgba(225,26,16,${0.26 * GLOW})`);
rg.addColorStop(0.55, `rgba(150,10,6,${0.08 * GLOW})`);
rg.addColorStop(1, 'rgba(100,0,0,0)');
gg.fillStyle = rg; gg.fillRect(0, 0, W, H);
glow.style.mixBlendMode = 'screen';

// ikoner som neonlinjer i en ruta på 100 × 100
const ICONS = {
  shield: '<path d="M50 8 L84 21 V48 C84 70 69 85 50 93 C31 85 16 70 16 48 V21 Z"/><polyline points="34,50 46,62 67,38"/>',
  cap: '<path d="M8 40 L50 22 L92 40 L50 58 Z"/><path d="M26 49 V68 C34 77 66 77 74 68 V49"/><path d="M92 40 V64"/><circle cx="92" cy="68" r="3"/>',
  building: '<rect x="24" y="12" width="52" height="80" rx="2"/><path d="M38 26h6M56 26h6M38 40h6M56 40h6M38 54h6M56 54h6"/><path d="M44 92 V72 H56 V92"/><path d="M12 92 H88"/>',
  rocket: '<path d="M50 8 C66 20 72 40 66 66 H34 C28 40 34 20 50 8 Z"/><circle cx="50" cy="36" r="8"/><path d="M34 52 L20 68 L34 66"/><path d="M66 52 L80 68 L66 66"/><path d="M42 74 C42 84 50 90 50 92 C50 90 58 84 58 74"/>',
  chart: '<path d="M14 88 H90"/><path d="M24 88 V62"/><path d="M42 88 V48"/><path d="M60 88 V56"/><path d="M78 88 V30"/><polyline points="18,52 38,36 56,44 82,16"/><polyline points="70,16 82,16 82,28"/>',
  home: '<path d="M12 48 L50 14 L88 48"/><path d="M22 40 V88 H78 V40"/><path d="M50 76 C44 70 36 65 36 57 C36 51 41 47 46 48 C48 48.5 49.5 50 50 51.5 C50.5 50 52 48.5 54 48 C59 47 64 51 64 57 C64 65 56 70 50 76 Z"/>',
  compass: '<circle cx="50" cy="50" r="38"/><path d="M50 22 L58 50 L50 78 L42 50 Z"/><circle cx="50" cy="50" r="3"/>'
};

const sign = document.getElementById('sign');
if (ICON) {
  const sw = +q.get('sw') || 4.2;
  sign.insertAdjacentHTML('beforeend',
    `<svg class="icon" width="${ICONSIZE}" height="${ICONSIZE}" viewBox="0 0 100 100" style="overflow:visible">` +
    ICONS[ICON].replace(/<(path|circle|rect|line|polyline)/g, `<$1 stroke-width="${sw}"`) + '</svg>');
}
if (TEXT) {
  const el = document.createElement('div');
  el.className = 'word';
  el.style.fontSize = SIZE + 'px';
  el.style.transform = 'translateY(' + (+q.get('ty') || 0) + 'px) rotate(' + (+q.get('rot') || 0) + 'deg)';
  el.textContent = TEXT;
  sign.appendChild(el);
}
document.fonts.load(SIZE + 'px "Comfortaa"', TEXT || 'a')
  .then(() => document.fonts.ready)
  .then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
