<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Knapp</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url("../fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url("../fonts/inter-latin-700-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
:root{color-scheme:dark}
html,body{height:100%;background:#191919}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.btn{position:absolute;inset:2px;border-radius:12px;display:flex;align-items:center;gap:16px;padding:0 20px;
  color:#fff;text-decoration:none;cursor:pointer;
  background:radial-gradient(130% 160% at 0% 50%,#4a1712 0%,#241515 55%,#181616 100%);
  box-shadow:0 0 0 1px #5a2a24;transition:box-shadow .2s ease}
.btn:hover,.btn:focus-visible{outline:none;box-shadow:0 0 0 1px #e5453d,0 0 22px rgba(229,69,61,.35)}
.icon{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
  background:rgba(229,69,61,.14);box-shadow:0 0 0 1px rgba(229,69,61,.45)}
.icon svg{width:28px;height:28px;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,80,70,.85))}
.icon svg *{fill:none;stroke:#ffd9d2;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.title{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:#c9afaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{flex:none;width:22px;height:22px;stroke:#ff6a5c;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 4px rgba(255,80,70,.8));transition:transform .2s ease}
.btn:hover .arrow{transform:translate(2px,-2px)}
</style>
</head>
<body>
<a class="btn" id="btn" href="https://ka8542fo-s-blip.github.io/sysb23-plugg/" target="_blank" rel="noopener">
  <span class="icon" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M8 40 L50 22 L92 40 L50 58 Z"/><path d="M26 49 V68 C34 77 66 77 74 68 V49"/><path d="M92 40 V64"/></svg></span>
  <span class="text"><span class="title" id="title">SYSB23 Plugg</span><span class="sub" id="sub">Öppna pluggsidan</span></span>
  <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 L17 7"/><path d="M9 7 H17 V15"/></svg>
</a>
<script>
// Ändra i adressen: ?text=...&sub=...&url=https://...
(function () {
  var q = new URLSearchParams(location.search);
  var btn = document.getElementById('btn');
  if (/^https:\/\//.test(q.get('url') || '')) btn.href = q.get('url');
  if (q.get('text')) document.getElementById('title').textContent = q.get('text');
  if (q.has('sub')) document.getElementById('sub').textContent = q.get('sub');
  btn.setAttribute('aria-label', document.getElementById('title').textContent);
})();
</script>
</body>
</html>
